<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1 class="main-title">No son solo flores amarillas</h1>
    </header>

   <main class="content-wrapper">
    <section class="left-panel">
        <p class="special-text">tú eres mi flor amarilla</p>
    </section>

    <section class="right-panel">
        <svg id="garden-svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b5a2b;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
                </linearGradient>
            </defs>
        </svg>
    </section>
</main>

    <footer>
        <div class="counter-container">
            <p>Besos acumulados: <span id="flower-counter">0</span></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
